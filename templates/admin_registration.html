<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fruit Detection</title>
  <link href="/static/css/main.css" rel="stylesheet">

</head>
<body>

  <nav>
    <a class="nav-link">Home</a>
    <a href="/about/" class="nav-link">About</a>

    <a href="/user_registration/" class="nav-link">Signup</a>
    <a href="/admin_login/" class="nav-link">Admin</a>
  </nav>

<section id="login" class="auth-section">
  <div class="auth-container">

        <!-- Signup Form -->
    <div class="auth-box">




      <h3>Admin Registration</h3>
      <form method="POST">

        <input type="text" name="admin_username" placeholder="Admin Username" required />
        <input type="email" name="email" placeholder="Admin Email" required />
        <input type="password" name="password" placeholder="Password" required />
        <input type="password" name="confirm_password" placeholder="Confirm Password" required />
        <button type="submit">Register</button>
      </form>
    </div>

  </div>
</section>

<footer class="site-footer">
  <div class="footer-content">
    <h3>ML – Based Fruit Identification System
Using Leaf Image</h3>
    <p>Experience The Future Today</p>

    <ul class="footer-links">

        <li><a href="admin_login/">Admin</a></li>
    </ul>

    <p class="footer-credit">© 2025 Fruit Detection. All rights reserved.</p>
  </div>
</footer>

    swal("{{message}}");

</script>
