    <section class="events-section section-padding">
    <div class="container">
        <div class="row justify-content-center">

            <!-- CAMERA SCREEN -->
            <div class="col-lg-8 col-12 mb-4">
                <div style="
                    background:#0f172a;
                    border-radius:16px;
                    padding:15px;
                    box-shadow:0 10px 30px rgba(0,0,0,0.25);
                ">

                    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                        <h5 style="color:white; margin:0;">Live Detection</h5>
                        <span id="status" style="color:#22c55e; font-weight:500;">Idle</span>
                    </div>

                    <!-- SCREEN -->
                    <div style="
                        width:100%;
                        height:420px;
                        background:black;
                        border-radius:12px;
                        overflow:hidden;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                    ">

                        <!-- Replace src with your stream -->
                        <img id="videoFeed"
                             src="/video_feed"
                             style="width:100%; height:100%; object-fit:cover;">
                    </div>

                </div>
            </div>

            <!-- CONTROL PANEL -->
            <div class="col-lg-4 col-12">
                <div style="
                    background:#ffffff;
                    border-radius:16px;
                    padding:25px;
                    box-shadow:0 10px 30px rgba(0,0,0,0.1);
                    height:100%;
                ">

                    <h5 style="margin-bottom:20px;">Controls</h5>

                    <!-- START -->
                    <button onclick="startCamera()" style="
                        width:100%;
                        padding:12px;
                        border:none;
                        border-radius:10px;
                        background:#22c55e;
                        color:white;
                        font-weight:600;
                        margin-bottom:12px;
                        transition:0.3s;
                    ">
                        ▶ Start Detection
                    </button>

                    <!-- STOP -->
                    <button onclick="stopCamera()" style="
                        width:100%;
                        padding:12px;
                        border:none;
                        border-radius:10px;
                        background:#ef4444;
                        color:white;
                        font-weight:600;
                        margin-bottom:20px;
                        transition:0.3s;
                    ">
                        ⏹ Stop Detection
                    </button>

                    <hr>

                    <!-- INFO -->
                    <div style="font-size:14px; color:#555;">
                        <p><strong>Model:</strong> YOLOv8</p>
                        <p><strong>Device:</strong> Raspberry Pi And Camera</p>
                        <p><strong>Status:</strong> <span id="statusText">Idle</span></p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</section>

    <script>
function startCamera() {
    document.getElementById("status").innerText = "Running";
    document.getElementById("status").style.color = "#22c55e";
    document.getElementById("statusText").innerText = "Running";

    fetch('/start_camera');
}

function stopCamera() {
    document.getElementById("status").innerText = "Stopped";
    document.getElementById("status").style.color = "#ef4444";
    document.getElementById("statusText").innerText = "Stopped";

    fetch('/stop_camera');
}
</script>
